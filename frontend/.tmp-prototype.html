<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI News Research Agent — Chat prototype</title>
<script>(function(){var t;try{t=localStorage.getItem('anra-theme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:oklch(98% 0.005 250);--surface:oklch(100% 0 0);--fg:oklch(22% 0.02 240);--muted:oklch(50% 0.018 240);
  --border:oklch(90% 0.008 240);--accent:oklch(58% 0.16 145);
  --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace;
  --accent-strong:oklch(47% 0.14 145);--accent-hover:oklch(40% 0.13 145);--on-accent:oklch(99% 0 0);
  --hover:oklch(95.5% 0.007 240);--active:oklch(93% 0.012 240);--sunken:oklch(97% 0.006 240);
  --border-strong:oklch(82% 0.012 240);--input-hover:oklch(74% 0.015 240);
  --warn-fg:oklch(43% 0.1 65);--warn-bg:oklch(96.5% 0.04 85);--warn-bd:oklch(85% 0.08 80);--warn-ink:oklch(32% 0.08 65);--warn-dot:oklch(70% 0.14 75);
  --danger:oklch(50% 0.19 27);--danger-hover:oklch(43% 0.17 27);--on-danger:oklch(99% 0 0);--danger-bg:oklch(96.5% 0.025 27);--danger-bd:oklch(84% 0.07 27);--danger-ink:oklch(34% 0.12 27);
  --info:oklch(46% 0.14 255);--info-bg:oklch(96.5% 0.022 255);--info-bd:oklch(86% 0.05 255);--info-ink:oklch(32% 0.1 255);
  --ring:oklch(58% 0.15 255);--composer-focus:oklch(70% 0.06 255);
  --chk:oklch(95% 0.012 240);--chk-hover:oklch(91% 0.015 240);--chk-bd:oklch(62% 0.02 240);
  --mono-bg:oklch(92% 0.03 250);--mono-fg:oklch(36% 0.08 250);
  --frost:oklch(100% 0 0 / .72);--frost-side:oklch(97% 0.006 240 / .86);--frost-panel:oklch(100% 0 0 / .86);
  --scrim:oklch(22% 0.02 240 / .32);--logo-invert:0;
  --shadow:0 1px 2px oklch(22% 0.02 240 / .06),0 4px 16px oklch(22% 0.02 240 / .06);
  --shadow-lg:0 12px 40px oklch(22% 0.02 240 / .18);
  --d1:120ms;--d2:200ms;--d3:320ms;--stagger:40ms;--ease:cubic-bezier(.2,0,0,1);
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:oklch(16.5% 0.01 250);--surface:oklch(20.5% 0.012 250);--fg:oklch(94% 0.006 250);--muted:oklch(71% 0.014 250);
  --border:oklch(29% 0.014 250);--accent:oklch(74% 0.15 150);
  --accent-strong:oklch(74% 0.15 150);--accent-hover:oklch(82% 0.13 150);--on-accent:oklch(18% 0.03 150);
  --hover:oklch(25% 0.014 250);--active:oklch(28.5% 0.016 250);--sunken:oklch(18.5% 0.011 250);
  --border-strong:oklch(38% 0.016 250);--input-hover:oklch(48% 0.018 250);
  --warn-fg:oklch(84% 0.12 82);--warn-bg:oklch(26% 0.045 75);--warn-bd:oklch(42% 0.07 75);--warn-ink:oklch(90% 0.06 85);--warn-dot:oklch(78% 0.13 80);
  --danger:oklch(72% 0.15 25);--danger-hover:oklch(80% 0.12 25);--on-danger:oklch(18% 0.03 25);--danger-bg:oklch(25% 0.05 25);--danger-bd:oklch(42% 0.09 25);--danger-ink:oklch(90% 0.05 25);
  --info:oklch(77% 0.11 245);--info-bg:oklch(25% 0.045 250);--info-bd:oklch(38% 0.07 250);--info-ink:oklch(88% 0.05 245);
  --ring:oklch(72% 0.13 250);--composer-focus:oklch(52% 0.08 250);
  --chk:oklch(30% 0.02 250);--chk-hover:oklch(34% 0.022 250);--chk-bd:oklch(60% 0.02 250);
  --mono-bg:oklch(32% 0.04 250);--mono-fg:oklch(86% 0.05 250);
  --frost:oklch(20.5% 0.012 250 / .74);--frost-side:oklch(18.5% 0.011 250 / .88);--frost-panel:oklch(20.5% 0.012 250 / .88);
  --scrim:oklch(8% 0.01 250 / .55);--logo-invert:1;
  --shadow:0 1px 2px oklch(0% 0 0 / .3),0 4px 16px oklch(0% 0 0 / .25);
  --shadow-lg:0 12px 40px oklch(0% 0 0 / .5);
}
.theme-snap,.theme-snap *,.theme-snap *::before,.theme-snap *::after{transition:none!important}
html.vt-theme::view-transition-group(root){animation:none}
html.vt-theme::view-transition-old(root),html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-shrink::view-transition-old(root){z-index:2}
html.vt-shrink::view-transition-new(root){z-index:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{width:14px;height:14px;object-fit:contain;flex:none;border-radius:3px}
.logo.gh{filter:invert(var(--logo-invert))}
.av{width:20px;height:20px;border-radius:5px;object-fit:cover;flex:none;background:var(--active);border:1px solid var(--border)}
.mono-av{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;flex:none;background:var(--mono-bg);color:var(--mono-fg);font:600 9px/1 var(--font-mono);font-style:normal;letter-spacing:.02em}
.rise{animation:rise var(--d2) var(--ease) both;animation-delay:calc(var(--i,0) * var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.fade-in{animation:fadeIn var(--d2) var(--ease) both}
@keyframes fadeIn{from{opacity:0}}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d3) var(--ease),opacity var(--d2) var(--ease)}
.collapse>*{min-height:0;overflow:hidden}
.collapse.shut{grid-template-rows:0fr;opacity:0}

/* prototype review strip (not part of the product) */
.proto{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;background:oklch(24% 0.02 240);color:oklch(92% 0.01 240);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid oklch(32% 0.02 240)}
.proto-label{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:oklch(72% 0.015 240);margin-right:6px;white-space:nowrap}
.proto button{height:26px;padding:0 10px;border-radius:5px;border:1px solid transparent;background:transparent;color:oklch(86% 0.01 240);font-size:12.5px;white-space:nowrap}
.proto button:hover{background:oklch(32% 0.02 240);color:oklch(97% 0 0)}
.proto button[aria-pressed=true]{background:oklch(96% 0.005 240);color:oklch(22% 0.02 240)}
.proto .sep{width:1px;height:18px;background:oklch(38% 0.02 240);margin:0 6px;flex:none}

.app{height:calc(100vh - 40px);display:grid;grid-template-columns:264px minmax(0,1fr) 0;transition:grid-template-columns var(--d3) var(--ease)}
.app.hist-open{grid-template-columns:264px minmax(0,1fr) 372px}

/* sidebar */
.sidebar{display:flex;flex-direction:column;min-height:0;background:var(--sunken);border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--surface);display:grid;place-items:center;font:600 12px/1 var(--font-mono)}
.brand b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.sb-tools{padding:4px 12px 10px;display:grid;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-weight:500;font-size:13px;white-space:nowrap;transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--active)}
.btn-primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn-primary:disabled,.btn:disabled{background:var(--active);border-color:var(--border);color:var(--muted);cursor:not-allowed}
.btn-danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn-danger:hover{background:var(--danger-hover);border-color:var(--danger-hover);color:var(--on-danger)}
.btn-cancel{color:var(--danger);border-color:var(--danger-bd)}
.btn-cancel:hover{background:var(--danger-bg);color:var(--danger-hover)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--hover)}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px}
.icon-btn{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:transparent;color:var(--muted);transition:background-color var(--d1) var(--ease)}
.icon-btn:hover{background:var(--active);color:var(--fg)}
.field{position:relative}
.field .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input{width:100%;height:32px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:0 10px;font-size:13px}
.field .input{padding-left:30px}
.input:hover{border-color:var(--input-hover)}
.input:focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:transparent}
select.input{padding-right:6px}
.sb-scroll{flex:1;overflow-y:auto;padding:0 8px 12px}
.sb-group{font:500 11px/1 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.sess-list{list-style:none;margin:0;padding:0}
.sess-li{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d3) var(--ease),opacity var(--d2) var(--ease)}
.sess-li>*{min-height:0}
.sess-li.anim>*{overflow:hidden}
.sess-li.shut{grid-template-rows:0fr;opacity:0}
.sess{position:relative;border-radius:7px;margin-bottom:1px;transition:background-color var(--d1) var(--ease)}
.sess:hover{background:var(--hover)}
.sess.active{background:var(--active)}
.sess.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{from{background:var(--info-bg);box-shadow:inset 0 0 0 1px var(--info-bd)}}
.sess-main{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:7px 64px 7px 10px;border-radius:7px}
.sess-title{font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sess.is-empty .sess-title{color:var(--muted);font-style:italic}
.sess-meta{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.busy-dot{display:inline-flex;align-items:center;gap:4px;color:var(--info);font-weight:500}
.busy-dot .ic{width:12px;height:12px}
.sess-actions{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0}
.sess:hover .sess-actions,.sess:focus-within .sess-actions,.sess.active .sess-actions{opacity:1}
.sess-rename{padding:5px 6px;display:flex;gap:4px}
.sess-rename .input{height:30px}
.sess-confirm{margin:2px 4px 8px;padding:10px;border:1px solid var(--danger-bd);background:var(--danger-bg);border-radius:7px;font-size:12.5px}
.sess-confirm p{margin:0 0 8px;color:var(--danger-ink)}
.sess-confirm div{display:flex;gap:6px;justify-content:flex-end}
.sb-empty{padding:16px 10px;font-size:12.5px;color:var(--muted)}
.sb-foot{border-top:1px solid var(--border);padding:8px 8px 10px;display:grid;gap:2px}
.theme-sw{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--fg);font-size:12.5px;font-weight:500;text-align:left;transition:background-color var(--d1) var(--ease)}
.theme-sw:hover{background:var(--hover)}
.theme-sw>.ic{color:var(--muted)}
.theme-sw .lbl{flex:1}
.track{width:30px;height:18px;border-radius:999px;background:var(--border-strong);position:relative;flex:none;transition:background-color var(--d2) var(--ease)}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px oklch(0% 0 0 / .25);transition:transform var(--d2) var(--ease)}
.theme-sw[aria-checked=true] .track{background:var(--fg)}
.theme-sw[aria-checked=true] .track::after{transform:translateX(12px)}
.sb-status{display:flex;align-items:center;gap:8px;padding:2px 8px;font-size:11.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.warn{background:var(--warn-dot)}

/* chat */
.chat{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat-head{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.chat-head h1{font:600 15px/1.25 var(--font-display);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chat-head .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.chat-head .grow{flex:1}
.theme-btn .ic-sun,[data-theme=dark] .theme-btn .ic-moon{display:none}
[data-theme=dark] .theme-btn .ic-sun{display:block}
.menu-btn{display:none}
.badge-fake{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd);font:500 11.5px/1 var(--font-mono);letter-spacing:.03em;white-space:nowrap}
.badge-fake .ic{width:13px;height:13px}
.btn[aria-pressed=true]{background:var(--active);border-color:var(--border-strong)}
.thread{flex:1;overflow-y:auto;padding:24px 20px calc(var(--dock-h,150px) + 12px)}
.thread-inner{max-width:880px;margin:0 auto;display:grid;gap:20px}
.msg-user{justify-self:end;max-width:min(560px,88%);display:grid;gap:6px;justify-items:end}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 4px 12px;padding:9px 13px;box-shadow:0 1px 1px oklch(22% 0.02 240 / .03);white-space:pre-wrap;word-break:break-word}
.req-meta{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;background:var(--active);color:var(--fg);font-size:11.5px;white-space:nowrap}
.chip .logo{width:12px;height:12px}
.msg-ai{display:grid;gap:12px;min-width:0}
.ai-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ai-label b{color:var(--fg);font-weight:600}
.digest-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding-bottom:2px}
.digest-head h2{font:600 16px/1.3 var(--font-display);margin:0}
.ref{font:500 12px/1 var(--font-mono);color:var(--muted);background:var(--active);padding:3px 6px;border-radius:4px}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid;font-size:13px}
.alert .ic{margin-top:2px}
.alert b{font-weight:600}
.alert p{margin:0}
.alert-warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-fg)}
.alert-warn p{color:var(--warn-ink)}
.alert-danger{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger)}
.alert-danger p{color:var(--danger-ink)}
.alert-info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info)}
.alert-info p{color:var(--info-ink)}
.alert-ok{background:var(--sunken);border-color:var(--border);color:var(--accent-strong)}
.alert-ok p{color:var(--fg)}
.alert .act{margin-left:auto;flex:none}

.section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.section-head h3{font:600 13.5px/1.3 var(--font-display);margin:0}
.section-head .sub{font-size:12px;color:var(--muted)}
.section-head .grow{flex:1}
.tile{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--border);flex:none}
.tile .logo{width:15px;height:15px}
.src-tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 5px;border-radius:4px;border:1px solid var(--border);font-size:11.5px;font-weight:500;color:var(--fg);background:var(--surface);white-space:nowrap}
.src-tag .logo{width:12px;height:12px}
.issue{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--sunken)}
.issue img{display:block;width:100%;height:auto;aspect-ratio:1080/460;border-radius:6px;border:1px solid var(--border)}
.issue-meta{display:grid;gap:3px;min-width:0;font-size:12.5px;color:var(--muted);justify-items:start}
.issue-meta .eyebrow{font:500 11px/1.3 var(--font-mono);letter-spacing:.05em;text-transform:uppercase}
.issue-meta b{font:600 15px/1.4 var(--font-display);color:var(--fg);word-break:break-word}
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 4px;padding:14px 14px 14px 10px;border-top:1px solid var(--border)}
.entry:first-child{border-top:0}
.rank{font:500 12px/22px var(--font-mono);color:var(--muted);text-align:right;padding-right:8px}
.entry h4{margin:0;display:flex;gap:8px;align-items:flex-start;font:600 15px/1.4 var(--font-display);word-break:break-word}
.entry h4 .av,.entry h4 .mono-av{margin-top:1px}
.entry h4 a{color:var(--fg)}
.entry h4 a:hover{color:var(--info)}
.entry-src{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:4px 0 8px;font-size:12px;color:var(--muted)}
.entry-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 20px;font-size:13px;margin:0}
.entry-body dt{font:500 11px/1.4 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.entry-body dd{margin:0;text-wrap:pretty}
.entry-foot{margin-top:10px}
.link-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;margin-left:-9px;border:0;border-radius:6px;background:transparent;color:var(--info);font-size:12.5px;font-weight:500;transition:background-color var(--d1) var(--ease)}
.link-btn:hover{background:var(--info-bg);color:var(--info-ink)}
.link-btn .ic{width:14px;height:14px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:780px;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--border);vertical-align:top}
th{border-top:0;font:500 11px/1.3 var(--font-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--sunken);white-space:nowrap}
td.r,th.r{text-align:right}
td.model{font-family:var(--font-mono);font-size:12.5px;word-break:break-all;min-width:220px}
td.model b{font-weight:500}
.model-cell{display:flex;gap:8px;align-items:flex-start}
td .av,td .mono-av{width:18px;height:18px;border-radius:4px;margin-top:1px}
td .pill{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--active);font-size:11.5px;white-space:nowrap}
td.var{font-size:12px;color:var(--muted);min-width:130px}
td.var code{font-family:var(--font-mono);font-size:11.5px;color:var(--fg);word-break:break-all}
.ext{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;white-space:nowrap}
.ext .ic{width:13px;height:13px}
.table-note{padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);background:var(--sunken)}

.md{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:14px;line-height:1.6}
.md h3{font:600 15px/1.35 var(--font-display);margin:0 0 6px}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin:3px 0}
.md code{font-family:var(--font-mono);font-size:12.5px;background:var(--active);padding:1px 5px;border-radius:4px;word-break:break-word}
.md blockquote{margin:0;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--sunken);color:var(--fg);font-size:13px}

@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.run,.md.streaming{border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ang),var(--border) 0 62%,var(--info) 80%,var(--border) 96%) border-box;animation:sheen 2.6s linear infinite}
@keyframes sheen{to{--ang:360deg}}
.run{border-radius:10px;padding:14px 16px;display:grid;gap:12px}
.run-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.run-head .ic{color:var(--info)}
.run-head .muted{font-weight:400;font-size:12px;margin-left:auto}
.segbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.segbar span{height:4px;border-radius:2px;background:var(--active);overflow:hidden}
.segbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--info)}
.segbar .s-run i{width:72%;animation:segrun 1.4s var(--ease) both}
@keyframes segrun{from{width:0}}
.segbar .s-done i{width:100%;background:var(--accent-strong)}
.segbar .s-warn i{width:100%;background:var(--warn-dot)}
.segbar .enter i{animation:segdone var(--d2) var(--ease) both}
@keyframes segdone{from{width:72%}}
.segbar.paused .s-run i{background:repeating-linear-gradient(-45deg,var(--info) 0 6px,var(--info-bd) 6px 12px);background-size:17px 100%;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:17px 0}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:grid;grid-template-columns:20px 16px 110px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-top:1px dashed var(--border)}
.steps li:first-child{border-top:0}
.steps .st{color:var(--muted);font-size:12.5px}
.st-done>.ic{color:var(--accent-strong)}
.st-run>.ic{color:var(--info)}
.st-queued>.ic{color:var(--border-strong)}
.st-warn>.ic{color:var(--warn-dot)}
.writing{display:grid;gap:7px;padding-top:4px}
.writing .line{height:10px;border-radius:3px;background:linear-gradient(90deg,var(--active),var(--hover),var(--active));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.caret{display:inline-block;width:7px;height:15px;background:var(--fg);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stream-text{font-size:13.5px;margin:0}

.empty{padding:9vh 0 0;max-width:560px;margin:0 auto;text-align:left}
.orbit{display:flex;margin-bottom:18px}
.orbit span{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;margin-right:-8px;box-shadow:0 0 0 3px var(--bg)}
.orbit img{width:22px;height:22px;object-fit:contain;border-radius:4px}
.empty h2{font:600 20px/1.3 var(--font-display);margin:0 0 6px}
.empty p{margin:0 0 18px;color:var(--muted);text-wrap:pretty}
.suggest{display:grid;gap:6px}
.suggest button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13.5px;transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.suggest button:hover{background:var(--hover);border-color:var(--border-strong)}
.suggest .ic{color:var(--muted)}

/* composer */
.composer-dock{position:absolute;left:0;right:0;bottom:0;padding:0 20px;pointer-events:none;background:linear-gradient(to bottom,transparent calc(100% - 38px),var(--bg) calc(100% - 30px))}
.composer-dock>*{pointer-events:auto}
.composer{max-width:880px;margin:0 auto;background:var(--frost);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.composer{background:var(--surface)}}
.composer:focus-within{border-color:var(--composer-focus)}
.composer.invalid{border-color:var(--danger-bd)}
.c-notice{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--border);border-radius:11px 11px 0 0}
.c-notice.info{background:var(--info-bg);color:var(--info-ink)}
.c-notice.info .ic{color:var(--info)}
.c-notice.warn{background:var(--warn-bg);color:var(--warn-ink)}
.c-notice.warn .ic{color:var(--warn-fg)}
.composer textarea{display:block;width:100%;border:0;resize:none;background:transparent;padding:12px 14px 6px;min-height:52px;max-height:180px;font-size:14px;line-height:1.5}
.composer textarea:focus{outline:none}
.c-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 10px 10px 12px}
.sources{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.sources legend{float:left;font-size:12px;color:var(--muted);margin-right:4px}
.src-chk{position:relative}
.src-chk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.src-chk span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 7px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--fg);white-space:nowrap;transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.src-chk .box{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;flex:none}
.src-chk .box .ic{width:9px;height:9px;stroke:var(--surface);stroke-width:3.5;opacity:0}
.src-chk:hover span{background:var(--hover)}
.src-chk input:checked+span{background:var(--chk);border-color:var(--chk-bd)}
.src-chk input:checked+span .box{background:var(--fg);border-color:var(--fg)}
.src-chk input:checked+span .box .ic{opacity:1}
.src-chk:hover input:checked+span{background:var(--chk-hover)}
.src-chk input:focus-visible+span{outline:2px solid var(--ring);outline-offset:2px}
.src-chk input:disabled+span{opacity:.55;cursor:not-allowed}
.sources[aria-invalid=true] .src-chk span{border-color:var(--danger-bd)}
.per{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:6px;height:28px;background:var(--surface)}
.stepper button{width:26px;height:26px;border:0;background:transparent;color:var(--muted);border-radius:5px;font-size:15px;line-height:1}
.stepper button:hover{background:var(--hover);color:var(--fg)}
.stepper input{width:34px;border:0;text-align:center;font:500 12.5px var(--font-mono);background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper input:focus{outline:none}
.stepper:focus-within{outline:2px solid var(--ring);outline-offset:1px}
.stepper.err{border-color:var(--danger)}
.c-actions{margin-left:auto;display:flex;gap:6px}
.c-errors{display:grid;gap:3px;padding:0 12px 10px}
.err-msg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--danger);margin:0}
.err-msg .ic{width:14px;height:14px}
.c-hint{max-width:880px;height:30px;margin:0 auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:12px;justify-content:space-between}

/* history */
.history{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);overflow:hidden}
.hist-head{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--border)}
.hist-head h2{font:600 14px/1 var(--font-display);margin:0}
.hist-head .grow{flex:1}
.hist-filters{padding:12px 16px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
.hist-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist-filters label{display:grid;gap:3px;font-size:11.5px;color:var(--muted)}
.hist-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.hist-scroll{flex:1;overflow-y:auto}
.hist-list{list-style:none;margin:0;padding:0}
.hit{padding:10px 16px;border-bottom:1px solid var(--border);display:grid;gap:4px;transition:background-color var(--d1) var(--ease)}
.hit:hover{background:var(--hover)}
.hit.open{background:var(--info-bg)}
.hit-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.hit-meta .ref{background:var(--surface);border:1px solid var(--border)}
.hit-title{border:0;background:transparent;padding:0;text-align:left;font-size:13px;font-weight:500;line-height:1.4;color:var(--fg);word-break:break-word}
.hit-title:hover{color:var(--info);text-decoration:underline}
.hit .ext{font-size:12px}
.opened{margin:12px 16px;border:1px solid var(--info-bd);border-radius:10px;overflow:hidden}
.opened-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:var(--info-bg);font-size:12px;color:var(--info-ink)}
.opened-head .grow{flex:1}
.opened-body{padding:12px;display:grid;gap:8px;font-size:13px}
.opened-body h3{margin:0;font:600 14px/1.4 var(--font-display);word-break:break-word}
.hist-empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:13px}
.hist-empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
.hist-empty p{margin:0 0 14px;text-wrap:pretty}

.hovercard{position:fixed;z-index:50;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;pointer-events:none;animation:fadeIn var(--d2) var(--ease)}
.hovercard img{display:block;width:100%;height:auto;aspect-ratio:1200/600;border-bottom:1px solid var(--border)}
.hovercard p{margin:0;padding:7px 12px;font-size:11.5px;color:var(--muted)}
.scrim{display:none}

@media (max-width:1279px){
  .app,.app.hist-open{grid-template-columns:264px minmax(0,1fr)}
  .history{position:fixed;top:40px;right:0;bottom:0;width:min(392px,92vw);z-index:30;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform var(--d3) var(--ease);background:var(--frost-panel);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2)}
  .app.hist-open .history{transform:none}
  .app.hist-open .scrim.for-hist{display:block}
}
@media (max-width:899px){
  .app,.app.hist-open{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:40px;left:0;bottom:0;width:min(300px,86vw);z-index:30;box-shadow:var(--shadow-lg);transform:translateX(-105%);transition:transform var(--d3) var(--ease);background:var(--frost-side);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2)}
  .app.sb-open .sidebar{transform:none}
  .app.sb-open .scrim.for-sb{display:block}
  .menu-btn{display:inline-grid}
  .chat-head .meta{display:none}
  .thread{padding:18px 12px calc(var(--dock-h,150px) + 12px)}
  .composer-dock{padding:0 10px}
  .entry-body{grid-template-columns:minmax(0,1fr)}
  .c-hint span:last-child{display:none}
}
@media (max-width:620px){
  .issue{grid-template-columns:minmax(0,1fr);gap:10px}
}
@media (max-width:560px){
  .btn-label{display:none}
  .steps li{grid-template-columns:20px 16px minmax(0,1fr) auto}
  .steps li>.mono{display:none}
}
.scrim{position:fixed;inset:40px 0 0;background:var(--scrim);z-index:20;border:0;padding:0}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:1ms!important}
  .run,.md.streaming{animation:none;background:var(--surface);border-color:var(--border)}
}
</style>
</head>
<body>
<div class="proto" role="toolbar" aria-label="Prototype states (review only, not part of the product)" data-od-id="prototype-state-bar">
  <span class="proto-label">Prototype · state</span>
  <button data-view="digest">Digest reply</button>
  <button data-view="empty">Empty conversation</button>
  <button data-view="streaming">Streaming</button>
  <button data-view="streamtext">Streaming text</button>
  <button data-view="busy">Conversation busy</button>
  <button data-view="cancelled">Cancelled</button>
  <button data-view="reconnecting">Reconnecting</button>
  <button data-view="nomatch">No history matches</button>
  <button data-view="validation">Validation error</button>
  <span class="sep"></span>
  <button data-act="toggle-fake" id="fake-toggle">Fake mode: on</button>
</div>

<div class="app hist-open" id="app">
  <aside class="sidebar" aria-label="Conversations" data-od-id="session-sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">AN</div>
      <div><b>AI News Research Agent</b><span>Local · single user</span></div>
    </div>
    <div class="sb-tools">
      <button class="btn" data-act="new-session" data-od-id="new-conversation"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New conversation</button>
      <div class="field" data-od-id="session-search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <label class="sr-only" for="sess-q">Search conversations</label>
        <input class="input" id="sess-q" type="search" placeholder="Search conversations" autocomplete="off">
      </div>
    </div>
    <div class="sb-scroll" id="sb-list"></div>
    <div class="sb-foot">
      <button class="theme-sw" id="theme-sw" role="switch" aria-checked="false" data-act="toggle-theme" data-od-id="theme-switch"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span class="lbl">Dark theme</span><span class="track" aria-hidden="true"></span></button>
      <div class="sb-status" id="sb-status" data-od-id="backend-status"></div>
    </div>
  </aside>
  <button class="scrim for-sb" data-act="close-sb" aria-label="Close sidebar" tabindex="-1"></button>

  <main class="chat" id="chat" data-od-id="chat">
    <header class="chat-head" id="chat-head"></header>
    <div class="thread" id="thread"><div class="thread-inner" id="thread-inner"></div></div>
    <div class="composer-dock" id="composer-dock"></div>
  </main>

  <button class="scrim for-hist" data-act="toggle-hist" aria-label="Close history" tabindex="-1"></button>
  <aside class="history" id="history" aria-label="History search" data-od-id="history-panel">
    <div class="hist-head">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      <h2>History</h2><span class="muted" style="font-size:12px">all past digests</span>
      <span class="grow"></span>
      <button class="icon-btn" data-act="toggle-hist" aria-label="Close history"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <form class="hist-filters" id="hist-filters" data-od-id="history-filters" onsubmit="return false">
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <label class="sr-only" for="hq">Search text</label>
        <input class="input" id="hq" type="search" placeholder="Search titles and summaries" autocomplete="off" data-od-id="history-text">
      </div>
      <div class="hist-row">
        <label>Source<select class="input" id="hs" data-od-id="history-source"><option value="all">All sources</option><option value="juya">Juya</option><option value="hf">Hugging Face</option><option value="github">GitHub</option><option value="zhihu">Zhihu</option><option value="bilibili">Bilibili</option></select></label>
        <label>Topic<select class="input" id="ht" data-od-id="history-topic"><option value="all">All topics</option><option>Headlines</option><option>Model releases</option><option>Developer ecosystem</option><option>Research &amp; insight</option><option>Industry</option></select></label>
      </div>
      <div class="hist-row">
        <label>From<input class="input" id="hfrom" type="date" data-od-id="history-date-from"></label>
        <label>To<input class="input" id="hto" type="date" data-od-id="history-date-to"></label>
      </div>
    </form>
    <div class="hist-bar"><span id="hist-count" aria-live="polite"></span><button class="btn btn-ghost btn-sm" data-act="clear-hist">Clear filters</button></div>
    <div class="hist-scroll"><div id="hist-open"></div><ul class="hist-list" id="hist-results"></ul></div>
  </aside>
</div>
<div class="hovercard" id="hovercard" role="tooltip" hidden><img alt="" width="1200" height="600"><p>Preview card · github.com</p></div>

<script>
const ICONS={
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',load:'<path d="M21 12a9 9 0 1 1-6.22-8.56"/>',

function renderRun(m){

  const banner=rc?`<div class="rc-wrap collapse"><div>${rc.ok
    ?`<div class="alert alert-ok" role="status">${I('check')}<p><b>Reconnected.</b> Progress was kept and the request continues.</p></div>`

function partial(html,chars){
  const t=document.createElement('div');t.innerHTML=html;
  const w=document.createTreeWalker(t,NodeFilter.SHOW_TEXT);let n,left=chars;
  while((n=w.nextNode())){
    if(n.textContent.length<left){left-=n.textContent.length;continue}
    n.textContent=n.textContent.slice(0,left);
    const c=document.createElement('span');c.className='caret';n.after(c);
    let x=c;while(x!==t){while(x.nextSibling)x.nextSibling.remove();x=x.parentNode}
    return t.innerHTML;
  }
  return html;
}

/* ---------- send / simulate / cancel ---------- */
function validate(){
  const c=S.comp,e={};const n=Number(c.n);
  if(!c.text.trim())e.text='Type a question or topic first.';
  if(!Object.values(c.sel).some(Boolean))e.sources='Select at least one source.';
  if(!Number.isInteger(n)||n<N_MIN||n>N_MAX)e.n=`Items per source must be a whole number from ${N_MIN} to ${N_MAX}.`;
  return e;
}
const now=()=>{const d=new Date();return[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')};
const alive=(sid,m)=>{const s=S.sessions.find(x=>x.id===sid);return s&&s.msgs.includes(m)?s:null};
const refresh=sid=>{if(S.sid===sid){renderThread();renderComposer();$('#thread').scrollTop=$('#thread').scrollHeight}renderSidebar()};
function send(){
  const s=cur();
  if(running(s)){S.comp.blocked=true;renderComposer();return}
  S.comp.errors=validate();
  if(Object.keys(S.comp.errors).length){renderComposer();const f=$('#composer [aria-invalid=true]');f&&(f.focus?.(),f.querySelector?.('input')?.focus());return}
  const c=S.comp,t=now();
  s.msgs.push({role:'user',text:c.text.trim(),sel:{...c.sel},n:Number(c.n),time:t.slice(0,5),fresh:true});
  if(s.title==='New conversation')s.title=c.text.trim().slice(0,48)+(c.text.trim().length>48?'…':'');
  s.t='2026-10-01T'+t.slice(0,5);
  const run={role:'ai',kind:'run',start:t,time:t.slice(0,5),phase:'fetching',reconnect:null,fresh:true,steps:SOURCES.filter(([k])=>c.sel[k]).map(([k])=>({k,st:'queued'})),sel:{...c.sel},n:Number(c.n)};
  s.msgs.push(run);c.text='';c.blocked=false;S.view='live';
  render('bottom');simulate(s.id,run);
}
function simulate(sid,run,delay){
  const tick=()=>{
    const s=alive(sid,run);if(!s)return;
    const r=run.steps.find(x=>x.st==='run');
    if(r){const f=r.k==='bilibili'||r.k==='zhihu';r.st=f?'warn':'done';r.c=f?0:Math.min(run.n,5);r.t=now();r.enter=true}
    const nx=run.steps.find(x=>x.st==='queued');
    if(nx){nx.st='run';S.timers.push(setTimeout(tick,1100+Math.random()*700))}
    else if(run.phase!=='writing'){run.phase='writing';S.timers.push(setTimeout(tick,1800))}
    else{s.msgs[s.msgs.indexOf(run)]={role:'ai',kind:'digest',id:run.id,fresh:true,time:run.time,dg:buildDigest(S.nextD++,'Oct 1, 2026 · '+run.time,run.sel,run.n)};S.comp.blocked=false}
    refresh(sid);
  };
  delay?S.timers.push(setTimeout(tick,delay)):tick();
}
function reconnectLoop(sid,run){
  const step=()=>{
    if(!alive(sid,run)||!run.reconnect)return;const r=run.reconnect;
    if(r.next>0){r.next--;const el=$('#rc-next');if(el)el.textContent=r.next>0?`next try in ${r.next}s`:'trying now…';S.timers.push(setTimeout(step,1000));return}
    if(!r.ok){r.ok=true;refresh(sid);S.timers.push(setTimeout(step,1600));return}
    $(`[data-mid="${run.id}"] .rc-wrap`)?.classList.add('shut');
    S.timers.push(setTimeout(()=>{run.reconnect=null;refresh(sid);simulate(sid,run,900)},reduced()?0:340));
  };
  S.timers.push(setTimeout(step,1000));
}
function streamText(sid,m){
  const t=document.createElement('div');t.innerHTML=m.html;const plain=t.textContent;
  const tick=()=>{
    if(!alive(sid,m)||!m.streaming)return;
    const nx=plain.indexOf(' ',m.chars+6+Math.floor(Math.random()*8));
    if(nx<0){m.streaming=false;refresh(sid);return}
    m.chars=nx;
    if(S.sid===sid){const box=$(`[data-mid="${m.id}"] .md`);if(box)box.innerHTML=partial(m.html,m.chars);const th=$('#thread');if(th.scrollHeight-th.scrollTop-th.clientHeight<200)th.scrollTop=th.scrollHeight}
    S.timers.push(setTimeout(tick,reduced()?15:70+Math.random()*60));
  };
  S.timers.push(setTimeout(tick,600));
}
function stopSim(){S.timers.forEach(clearTimeout);S.timers=[]}
function cancel(){
  const s=cur();const i=s.msgs.findIndex(m=>m.kind==='run'||m.streaming);if(i<0)return;
  stopSim();const r=s.msgs[i];const old=$(`[data-mid="${r.id}"]`);const h0=old?old.offsetHeight:0;
  s.msgs[i]=r.streaming?{role:'ai',kind:'cancelled',mode:'text',at:now(),time:r.time,id:r.id,fresh:true}
    :{role:'ai',kind:'cancelled',at:now(),done:r.steps.filter(x=>x.st==='done'||x.st==='warn').length,total:r.steps.length,time:r.time,id:r.id,fresh:true};
  S.comp.blocked=false;if(S.view!=='live')S.view='cancelled';render('bottom');
  const nb=$(`[data-mid="${r.id}"]`);
  if(nb&&h0&&!reduced()){const h1=nb.offsetHeight;nb.style.height=h0+'px';nb.style.overflow='hidden';nb.offsetHeight;
    nb.style.transition='height var(--d3) var(--ease)';nb.style.height=h1+'px';nb.addEventListener('transitionend',()=>{nb.style.cssText=''},{once:true})}
}

/* ---------- repo preview hover card ---------- */
const hc=$('#hovercard');let hcT;
function showHC(a){
  const img=hc.querySelector('img');img.src=a.dataset.preview;img.alt=`GitHub preview card for ${a.textContent}`;hc.hidden=false;
  const r=a.getBoundingClientRect(),w=hc.offsetWidth,h=hc.offsetHeight;let top=r.bottom+8;if(top+h>innerHeight-8)top=r.top-h-8;
  hc.style.top=Math.max(8,top)+'px';hc.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
}
const hideHC=()=>{clearTimeout(hcT);hc.hidden=true};
document.addEventListener('mouseover',e=>{const a=e.target.closest('[data-preview]');if(a){clearTimeout(hcT);hcT=setTimeout(()=>showHC(a),400)}});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-preview]'))hideHC()});
document.addEventListener('focusin',e=>{const a=e.target.closest('[data-preview]');if(a)showHC(a)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-preview]'))hideHC()});
$('#thread').addEventListener('scroll',hideHC,{passive:true});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}
  const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id;
  switch(a.dataset.act){
    case'toggle-theme':setTheme(S.theme==='dark'?'light':'dark',true,themeOrigin(e,a));break;
    case'toggle-fake':S.fake=!S.fake;render();break;
    case'open-sb':S.sbOpen=true;render();break;
    case'close-sb':S.sbOpen=false;render();break;
    case'toggle-hist':S.histOpen=!S.histOpen;render();break;
    case'open-sess':S.sid=id;S.sbOpen=false;S.deleting=null;S.comp.errors={};S.comp.blocked=false;render('bottom');break;
    case'new-session':{let s=S.sessions.find(x=>!x.msgs.length);
      if(s)S.flash=s.id;else{s={id:'s'+Date.now(),title:'New conversation',t:'2026-10-01T'+now().slice(0,5),msgs:[]};S.sessions.push(s);S.enter=s.id;S.flash=s.id}
      S.sid=s.id;S.sbOpen=false;S.comp.errors={};S.comp.blocked=false;render();$('#msg').focus();break}
    case'rename':S.renaming=id;S.deleting=null;renderSidebar();break;
    case'rename-cancel':S.renaming=null;renderSidebar();break;
    case'delete':S.deleting=S.deleting===id?null:id;S.renaming=null;renderSidebar();break;
    case'delete-cancel':S.deleting=null;renderSidebar();break;
    case'delete-confirm':{
      const fin=()=>{const s=S.sessions.find(x=>x.id===id);if(s&&running(s))stopSim();
        S.sessions=S.sessions.filter(x=>x.id!==id);S.deleting=null;
        if(!S.sessions.length)S.sessions.push({id:'s'+Date.now(),title:'New conversation',t:'2026-10-01T'+now().slice(0,5),msgs:[]});
        if(S.sid===id)S.sid=[...S.sessions].sort((a,b)=>b.t.localeCompare(a.t))[0].id;render()};
      const li=$(`.sess-li[data-sid="${id}"]`);a.closest('.sess-confirm')?.remove();
      if(li&&!reduced()){li.classList.add('anim','shut');setTimeout(fin,330)}else fin();break}
    case'suggest':case'followup':S.comp.text=a.dataset.act==='followup'?`Tell me more about “${a.dataset.t}”: what it is and how I could try it.`:a.dataset.t;S.comp.errors={};
      if(window.innerWidth<1280)S.histOpen=false;render();const m=$('#msg');m.focus();m.setSelectionRange(m.value.length,m.value.length);break;
    case'cancel':cancel();break;
    case'retry':{const u=[...cur().msgs].reverse().find(m=>m.role==='user');if(u){S.comp.text=u.text;S.comp.sel={...SEL_BASE,...u.sel};S.comp.n=u.n}renderComposer();$('#msg').focus();break}
    case'n-dec':case'n-inc':{const n=Number(S.comp.n)||0;S.comp.n=Math.max(N_MIN,Math.min(N_MAX,n+(a.dataset.act==='n-inc'?1:-1)));delete S.comp.errors.n;renderComposer();break}
    case'open-hit':S.openHit=id;renderHistory();$('.hist-scroll').scrollTop=0;break;
    case'close-hit':S.openHit=null;renderHistory();break;
    case'clear-hist':S.hist={q:'',src:'all',topic:'all',from:'',to:''};S.openHit=null;syncHistControls();renderHistory();break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='composer'){e.preventDefault();send()}
  if(e.target.dataset.act==='rename-form'){e.preventDefault();const s=S.sessions.find(x=>x.id===e.target.dataset.id);const v=e.target.querySelector('input').value.trim();
    s.title=v||'New conversation';S.renaming=null;renderSidebar();renderHead()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sess-q'){S.sq=t.value;renderSidebar()}
  if(t.id==='msg'){S.comp.text=t.value;if(S.comp.errors.text&&t.value.trim()){delete S.comp.errors.text;renderComposer();$('#msg').focus();$('#msg').setSelectionRange(t.value.length,t.value.length)}}
  if(t.id==='per-n'){S.comp.n=t.value}
  const hk={hq:'q',hs:'src',ht:'topic',hfrom:'from',hto:'to'}[t.id];if(hk){S.hist[hk]=t.value;renderHistory()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.src){S.comp.sel[t.dataset.src]=t.checked;if(S.comp.errors.sources&&Object.values(S.comp.sel).some(Boolean)){delete S.comp.errors.sources;renderComposer()}}
  if(t.id==='per-n'&&S.comp.errors.n&&!validate().n){delete S.comp.errors.n;renderComposer()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='msg'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
  if(e.key==='Escape'){if(!hc.hidden)hideHC();else if(S.renaming){S.renaming=null;renderSidebar()}else if(S.deleting){S.deleting=null;renderSidebar()}else if(S.sbOpen){S.sbOpen=false;render()}else if(S.histOpen&&window.innerWidth<1280){S.histOpen=false;render()}}
});
const dockRO=new ResizeObserver(()=>{const d=$('#composer-dock'),t=$('#thread');$('#chat').style.setProperty('--dock-h',d.offsetHeight+'px');d.style.right=(t.offsetWidth-t.clientWidth)+'px'});
dockRO.observe($('#composer-dock'));dockRO.observe($('#thread'));
setTheme(S.theme);syncHistControls();render('top');
</script>
</body>
</html>
